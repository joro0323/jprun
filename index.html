<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일본어 어휘런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one fixed game frame (10:7) centered on a night-navy ground; HUD + quiz card float over the canvas */
:root{
  --ground:#121932; --frame:#435078; --panel:#252c47e8; --panel-line:#ffffff55;
  --paper:#fff4ce; --ink:#342b34; --wood:#9e7044; --gold:#ffce55; --gold-deep:#bd783a;
  --good:#fff2a8; --bad:#ffb4c4; --muted:#e5e8f3;
  --f-jp:"M PLUS Rounded 1c","Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-ko:"Jua","M PLUS Rounded 1c","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ground);color:#fff;font-family:var(--f-ko)}
body{overflow:hidden;touch-action:none}
#wrap{height:100%;display:grid;place-items:center;padding:8px}
#frame{position:relative;width:min(1000px,100%);height:100%;max-height:720px;max-width:100%;aspect-ratio:10/7;border:3px solid var(--frame);border-radius:14px;overflow:hidden;background:#8dd9ef;box-shadow:0 14px 45px #0008}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;z-index:2;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.box{background:var(--panel);border:2px solid var(--panel-line);border-radius:12px;padding:7px 12px;text-shadow:1px 2px #17213a;box-shadow:0 3px #17213a55;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.box .big{font-size:22px;color:var(--good)}
.right{text-align:right;display:flex;gap:8px;align-items:flex-start}
#timer.warn{color:#ff8fa3}
.hudbtn{pointer-events:auto;border:2px solid var(--panel-line);background:var(--panel);color:#fff;border-radius:12px;width:44px;height:44px;font-size:18px;cursor:pointer;box-shadow:0 3px #17213a55}
.hudbtn:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.qbox{position:absolute;z-index:2;top:84px;left:50%;transform:translateX(-50%);width:min(660px,90%);background:var(--paper);color:var(--ink);border:3px solid var(--wood);border-radius:16px;padding:8px 16px;text-align:center;box-shadow:0 5px #734c3c55}
.qlabel{font-size:13px;color:#7b5a49;letter-spacing:.04em}
.qword{font-size:clamp(20px,3vw,30px);line-height:1.5;margin-top:2px}
.qword.jp{font-family:var(--f-jp);font-weight:800}
.qword rt{font-size:.45em;font-weight:500;color:#8a6a5a}
.qsub{font-size:12px;color:#675b60;margin-top:2px}
.feedback{position:absolute;z-index:3;left:50%;top:215px;transform:translateX(-50%);font-size:20px;text-align:center;text-shadow:2px 2px #28304d;pointer-events:none;width:90%;font-family:var(--f-jp),var(--f-ko);font-weight:800}
.layer{position:absolute;z-index:5;inset:0;background:rgba(18,25,50,.93);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:22px;text-align:center;overflow:auto;touch-action:pan-y}
.layer>:first-child{margin-top:auto}.layer>:last-child{margin-bottom:auto}
h1{font-family:var(--f-jp);font-weight:800;font-size:clamp(34px,6.5vw,60px);margin:0;color:#fff3be;text-shadow:4px 5px #623e48;line-height:1.1}
.sub{font-size:clamp(16px,2.4vw,22px);color:var(--gold);margin-top:-6px}
.layer p{max-width:680px;line-height:1.7;color:var(--muted);margin:6px 0}
.card{background:#272f50;border:2px solid #66749a;border-radius:15px;padding:12px 18px;max-width:720px;width:100%}
.btn{border:0;border-radius:12px;padding:12px 22px;background:var(--gold);color:#493044;font-family:var(--f-ko);font-size:20px;box-shadow:0 5px var(--gold-deep);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px var(--gold-deep)}
.btn.ghost{background:#3a4470;color:#fff;box-shadow:0 5px #1c2342;font-size:16px;padding:9px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.seg{display:inline-flex;border:2px solid #66749a;border-radius:12px;overflow:hidden}
.seg button{border:0;background:#1d2440;color:#cfd5ea;font-family:var(--f-ko);font-size:15px;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#493044}
.small{font-size:13px;color:#aab3cf}
.touch{position:absolute;z-index:3;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.touch .grp{display:flex;gap:8px}
.touch button{pointer-events:auto;width:56px;height:52px;border:2px solid #fff;border-radius:14px;color:#fff;background:#222a4dcc;font-size:20px;touch-action:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{background:#1d2440;border-radius:10px;padding:8px 4px}
.stat b{display:block;font-size:24px;color:var(--good);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#aab3cf}
.miss{max-height:190px;overflow:auto;text-align:left;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.miss div{background:#1d2440;border-radius:8px;padding:6px 10px;font-size:14px;min-width:0}
.miss .j{font-family:var(--f-jp);font-weight:800;color:#fff3be}
.miss .k{color:#cfd5ea;font-size:13px}
@media(max-width:650px){.box{font-size:11px;padding:5px 8px}.box .big{font-size:16px}.qbox{top:66px;padding:6px 10px}.feedback{top:170px;font-size:16px}.touch button{width:48px;height:46px}.layer{padding:12px;gap:10px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hudbtn{width:36px;height:36px;font-size:15px}}
@media(prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>

</head>
<body>
<div id="wrap"><div id="frame"><canvas id="game" aria-label="게임 화면"></canvas>
<div class="hud">
  <div class="box" id="stats"><span class="big">0점</span><br>정답 0 / 0</div>
  <div class="right"><div class="box" id="life"><span class="big" id="timer">5:00</span><br>콤보 0</div><button class="hudbtn" id="pauseBtn" aria-label="일시정지">⏸</button></div>
</div>
<div class="qbox"><div class="qlabel" id="qlabel">日本語 単語ラン</div><div class="qword" id="prompt">단어 카드가 다가오면 정답 길로!</div><div class="qsub" id="hint">좌우로 움직여 정답이 적힌 길을 고르세요.</div></div>
<div class="feedback" id="feedback"></div>
<div class="touch" id="touch" hidden><div class="grp"><button data-act="left" aria-label="왼쪽 길">◀</button><button data-act="right" aria-label="오른쪽 길">▶</button></div><div class="grp"><button data-act="jump" aria-label="점프">▲</button><button data-act="slide" aria-label="슬라이드">▼</button></div></div>

<section class="layer" id="menu">
  <h1>日本語 単語ラン</h1><div class="sub">일본어 어휘런</div>
  <div class="card">
    <p>단어 카드가 캐릭터 앞에 오면 <b>정답이 적힌 길</b>로 옮기세요. 맞힐 때마다 <b>10점</b>! 한 판은 <b>5분</b>입니다.</p>
    <p class="small">← → / A·D 길 바꾸기 · ↑ / Space 보라 몬스터 점프 · ↓ 파란 날개 몬스터 슬라이드 · P 일시정지<br>젤리 8개를 모으면 별 파워가 나타나 몬스터를 무찌를 수 있어요.</p>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="문제 방향">
      <button id="m-mix" data-mode="mix" aria-pressed="true">섞어서</button>
      <button id="m-jk" data-mode="jk" aria-pressed="false">일본어 → 뜻</button>
      <button id="m-kj" data-mode="kj" aria-pressed="false">뜻 → 일본어</button>
    </div>
    <div class="seg" role="group" aria-label="효과음">
      <button id="snd-on" aria-pressed="true">🔊 소리 켜기</button>
      <button id="snd-off" aria-pressed="false">🔇 끄기</button>
    </div>
  </div>
  <button class="btn" id="start">달리기 시작</button>
  <div class="small" id="deckInfo"></div>
</section>
<section class="layer" id="pause" hidden><h1>ちょっと休憩</h1><div class="sub">잠깐 쉬기</div><div class="row"><button class="btn" id="resume">계속 달리기</button><button class="btn ghost" id="quit">결과 보고 끝내기</button><button class="btn ghost" id="pauseHome">🏠 처음 화면</button></div></section>
<section class="layer" id="over" hidden><h1>お疲れさま！</h1><div class="sub">5분 달리기 끝</div><div class="card" id="result"></div><div class="row"><button class="btn" id="again">새 단어로 다시 달리기</button><button class="btn ghost" id="toMenu">처음 화면</button></div></section>
</div></div>

function makeQuiz(){
 const it=nextWord(),dir=mode==='mix'?(Math.random()<.5?'jk':'kj'):mode;
 const pool=BYPOS[it.pos].filter(function(x){return x.id!==it.id&&x.ko!==it.ko&&x.jp!==it.jp});
 let cands=shuffle(pool.filter(function(x){return x.topic===it.topic}));if(cands.length<2)cands=shuffle(pool);
 const picks=[];for(const c of cands){if(picks.length>=2)break;if(picks.every(function(p){return p.ko!==c.ko&&p.jp!==c.jp}))picks.push(c)}
 const choices=shuffle([it].concat(picks));
 return {at:G.distance+940,answer:it,dir:dir,choices:choices,correctLane:choices.indexOf(it),resolved:false}
}

function resolveQuiz(){
 const q=G.quiz;if(!q||q.resolved)return;q.resolved=true;G.asked++;
 const ok=Math.round(G.laneVisual)===q.correctLane;
 if(ok){G.correct++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.score+=10;G.speed=Math.min(380,G.speed+4);floatText('+10','#fff36a');

 else{G.combo=0;G.flash=.2;if(!G.missed.some(function(m){return m.id===q.answer.id}))G.missed.push(q.answer);SFX.wrong();toast('정답은 '+jpPlain(q.answer)+' = '+q.answer.ko,false)}
 $('qlabel').textContent=ok?'정답! 복습해요':'오답! 정답을 확인하세요';$('prompt').className='qword jp';$('prompt').innerHTML=rubyHTML(q.answer)+' <span style="font-family:var(--f-ko);font-weight:400;font-size:.7em">— '+esc(q.answer.ko)+'</span>';
 $('hint').textContent=ok?'+10점 · 콤보 '+G.combo:'다음 단어에서 만회해요!';

}

function hit(){if(G.inv>0)return;G.combo=G.combo;G.inv=1.3;G.flash=.25;G.speed=Math.max(220,G.speed-35);SFX.hit();toast('앗! 몬스터와 부딪혀 속도가 줄었어요',false)}
function update(dt){
 if(!G||G.state!=='play')return;
 G.time-=dt;const sec=Math.ceil(G.time);if(sec<=10&&sec<G.lastTick&&sec>0){G.lastTick=sec;SFX.tick()}
 if(G.time<=0){G.time=0;renderHud();finish();return}
 G.distance+=G.speed*dt;G.laneVisual+=(G.lane-G.laneVisual)*Math.min(1,dt*9);G.speed=Math.min(380,G.speed+dt*1.2);
 G.jump=Math.max(0,G.jump-dt);G.slide=Math.max(0,G.slide-dt);G.inv=Math.max(0,G.inv-dt);G.flash=Math.max(0,G.flash-dt);
 for(const f of G.floats){f.life-=dt*1.1;f.y-=dt*60}G.floats=G.floats.filter(function(f){return f.life>0});
 if(G.distance>=G.nextJelly){G.jellies.push({at:G.distance+900,lane:Math.floor(Math.random()*3),dead:false});G.nextJelly+=185+Math.random()*75}
 if(G.distance>=G.nextObstacle){let at=G.distance+870;if(G.quiz&&Math.abs(at-G.quiz.at)<650)at=G.quiz.at+650;G.obstacles.push({at:at,lane:Math.floor(Math.random()*3),type:Math.random()<.67?'rock':'bird',dead:false});G.nextObstacle+=470+Math.random()*240}
 if(!G.quiz&&G.distance>=G.nextQuiz){G.quiz=makeQuiz();showQuizPrompt(G.quiz);SFX.quiz();const q=G.quiz;G.obstacles=G.obstacles.filter(function(o){return Math.abs(o.at-q.at)>600});G.jellies=G.jellies.filter(function(j){return Math.abs(j.at-q.at)>80})}
 const pass=G.distance+25;G.powerActive=Math.max(0,G.powerActive-dt);
 for(const o of G.obstacles){if(o.dead)continue;if(Math.abs(o.at-pass)<G.speed*dt+8&&Math.abs(o.lane-G.laneVisual)<.42){const powered=G.powerActive>0,safe=o.type==='rock'?G.jump>.12:G.slide>.12;o.dead=true;if(powered){SFX.smash();toast('별 파워로 몬스터 격파!',true)}else if(safe){SFX.dodge();toast(o.type==='rock'?'멋진 점프!':'날쌘 슬라이드!',true)}else hit()}}
 if(G.powerPickup&&G.powerPickup.at<G.distance-100)G.powerPickup=null;
 if(!G.powerPickup&&G.powerActive<=0&&G.jellyCharge>=8)G.powerPickup={at:G.distance+650,lane:G.lane};
 if(G.powerPickup&&Math.abs(G.powerPickup.at-pass)<G.speed*dt+12&&Math.abs(G.powerPickup.lane-G.laneVisual)<.42){G.powerPickup=null;G.powerActive=8;G.jellyCharge=Math.max(0,G.jellyCharge-8);SFX.power();toast('별 파워! 8초 동안 몬스터를 무찌르세요!',true)}
 for(const j of G.jellies){if(!j.dead&&Math.abs(j.at-pass)<G.speed*dt+10&&Math.abs(j.lane-G.laneVisual)<.42){j.dead=true;G.jellyCount++;G.jellyCharge++;SFX.jelly();if(G.jellyCharge>=8&&!G.powerPickup&&G.powerActive<=0){G.powerPickup={at:G.distance+720,lane:G.lane};toast('젤리 8개! 별 파워가 나타났어요',true)}}}
 G.obstacles=G.obstacles.filter(function(o){return !o.dead&&o.at>G.distance-100});G.jellies=G.jellies.filter(function(j){return !j.dead&&j.at>G.distance-100});
 if(G.quiz&&G.distance>=G.quiz.at)resolveQuiz();

}
function renderHud(){

 $('stats').innerHTML='<span class="big">'+G.score+'점</span><br>정답 '+G.correct+' / '+G.asked+'<br>'+(G.powerActive>0?'⭐ 파워 '+Math.ceil(G.powerActive)+'초':'⭐ 젤리 '+Math.min(8,G.jellyCharge)+'/8');

function resize(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);if(G&&G.state!=='play')draw()}
function round(x,y,w,h,r,fill,stroke){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawRoad(w,h){const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#78c9ec');sky.addColorStop(.58,'#d1f4fc');sky.addColorStop(.59,'#8bcf84');sky.addColorStop(1,'#52aa71');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
 const dist=G?G.distance:0;
 // 먼 산과 도리이
 ctx.fillStyle='#a9d8c0';ctx.beginPath();ctx.moveTo(0,h*.59);for(let i=0;i<=8;i++){const x=i*w/8;ctx.lineTo(x,h*.59-(i%2?h*.07:h*.03))}ctx.lineTo(w,h*.59);ctx.fill();
 ctx.fillStyle='#ffffffcc';ctx.beginPath();ctx.moveTo(w*.78,h*.59);ctx.lineTo(w*.86,h*.44);ctx.lineTo(w*.94,h*.59);ctx.fill();ctx.fillStyle='#7aa8c9';ctx.beginPath();ctx.moveTo(w*.735,h*.59);ctx.lineTo(w*.8,h*.505);ctx.quadraticCurveTo(w*.86,h*.48,w*.92,h*.505);ctx.lineTo(w*.985,h*.59);ctx.fill();
 for(let i=0;i<5;i++){const x=((i*230-dist*.12)%(w+180)+w+180)%(w+180)-80,y=h*.2+(i%2)*h*.05;ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.arc(x+27,y-10,28,0,7);ctx.arc(x+58,y,20,0,7);ctx.fill()}
 const vx=w/2,vy=h*.25;ctx.fillStyle='#8d694f';ctx.beginPath();ctx.moveTo(vx-48,vy);ctx.lineTo(vx+48,vy);ctx.lineTo(w*.96,h);ctx.lineTo(w*.04,h);ctx.closePath();ctx.fill();ctx.fillStyle='#c59465';ctx.beginPath();ctx.moveTo(vx-34,vy);ctx.lineTo(vx+34,vy);ctx.lineTo(w*.88,h);ctx.lineTo(w*.12,h);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#ffe2a8';ctx.lineWidth=3;for(let i=0;i<2;i++){const x=vx+(i-.5)*18;ctx.beginPath();ctx.moveTo(x,vy);ctx.lineTo(w*(.375+.25*i),h);ctx.stroke()}
 ctx.strokeStyle='#f4d495';for(let i=0;i<3;i++){const y=vy+((dist*.6+i*125)%(h*.7));const t=(y-vy)/(h-vy),x1=vx+(w*.12-vx)*t,x2=vx+(w*.88-vx)*t;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke()}}
function yFor(at,h){return h*.81-(at-G.distance)*.31}
function drawRunner(x,y,t){ctx.save();ctx.translate(x,y+Math.sin(t*12)*3);if(G.inv>0&&Math.floor(t*18)%2)ctx.globalAlpha=.35;ctx.fillStyle='#754634';ctx.beginPath();ctx.ellipse(0,18,21,7,0,0,7);ctx.fill();const g=ctx.createRadialGradient(-7,-15,3,0,0,31);g.addColorStop(0,'#ffd987');g.addColorStop(1,'#c8783e');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,25,0,7);ctx.fill();ctx.strokeStyle='#7d4a32';ctx.lineWidth=3;ctx.stroke();
 // 머리띠(はちまき)
 ctx.fillStyle='#fff';ctx.fillRect(-24,-17,48,7);ctx.fillStyle='#e8464f';ctx.beginPath();ctx.arc(0,-13.5,3,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(22,-15);ctx.lineTo(34,-22+Math.sin(t*20)*3);ctx.lineTo(33,-12);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-2,6,0,7);ctx.arc(8,-2,6,0,7);ctx.fill();ctx.fillStyle='#3b2b39';ctx.beginPath();ctx.arc(-7,-1,2.5,0,7);ctx.arc(9,-1,2.5,0,7);ctx.fill();ctx.fillStyle='#ed7d77';ctx.beginPath();ctx.arc(-16,7,4,0,7);ctx.arc(16,7,4,0,7);ctx.fill();ctx.strokeStyle='#70404a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(1,6,5,.15,Math.PI-.15);ctx.stroke();

function monster(x,y,type){ctx.save();ctx.translate(x,y);if(type==='rock'){ctx.fillStyle='#9867cf';ctx.beginPath();ctx.moveTo(-26,17);ctx.quadraticCurveTo(-32,-7,-14,-18);ctx.lineTo(-8,-29);ctx.lineTo(0,-18);ctx.lineTo(12,-28);ctx.lineTo(16,-14);ctx.quadraticCurveTo(33,-4,25,17);ctx.quadraticCurveTo(0,28,-26,17);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-3,6,0,7);ctx.arc(9,-3,6,0,7);ctx.fill();ctx.fillStyle='#30273c';ctx.beginPath();ctx.arc(-7,-2,2.5,0,7);ctx.arc(10,-2,2.5,0,7);ctx.fill();ctx.fillStyle='#ff9aa8';ctx.beginPath();ctx.arc(-17,7,4,0,7);ctx.arc(18,7,4,0,7);ctx.fill()}else{ctx.fillStyle='#4b72bd';ctx.beginPath();ctx.ellipse(0,0,29,15,0,0,7);ctx.ellipse(-16,-5,12,8,-.5,0,7);ctx.ellipse(16,-5,12,8,.5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,0,5,0,7);ctx.arc(8,0,5,0,7);ctx.fill();ctx.fillStyle='#222c46';ctx.beginPath();ctx.arc(-6,1,2,0,7);ctx.arc(9,1,2,0,7);ctx.fill()}ctx.strokeStyle='#38213b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,-11);ctx.lineTo(-5,-7);ctx.moveTo(14,-11);ctx.lineTo(5,-7);ctx.stroke();ctx.beginPath();ctx.moveTo(-6,12);ctx.quadraticCurveTo(0,6,6,12);ctx.stroke();ctx.restore()}

function drawCard(x,y,cw,item,showJp,i){

 else{size=Math.min(19,cw*.13);ctx.font=size+'px '+FKO;lines=wrapText(item.ko,inner);while(lines.length>3&&size>10){size-=1;ctx.font=size+'px '+FKO;lines=wrapText(item.ko,inner)}}

 ctx.fillStyle='#342a38';ctx.font=(showJp?'800 ':'')+size+'px '+(showJp?FJP:FKO);for(const l of lines){ctx.fillText(l,x,yy);yy+=lh}

}
function draw(){
 if(!G)return;const w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);drawRoad(w,h);
 for(const o of G.obstacles){const y=yFor(o.at,h);if(y<100||y>h+50)continue;monster(w*lanes[o.lane],y,o.type)}
 if(G.powerPickup){const py=yFor(G.powerPickup.at,h),px=w*lanes[G.powerPickup.lane];if(py>100&&py<h+40){ctx.save();ctx.translate(px,py);ctx.shadowColor='#fff36a';ctx.shadowBlur=24;ctx.fillStyle='#ffe45d';ctx.strokeStyle='#fff9ce';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?11:21;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}}

 if(G.quiz){const y=yFor(G.quiz.at,h),cw=Math.min(184,w*.235);if(y>70&&y<h+90)for(let i=0;i<3;i++)drawCard(w*lanes[i],y,cw,G.quiz.choices[i],G.quiz.dir==='kj',i)}
 const laneX=w*(.25+.25*G.laneVisual),laneY=h*.81,t=performance.now()/1000;ctx.fillStyle='#fff8c566';ctx.beginPath();ctx.ellipse(laneX,laneY+26,31,8,0,0,7);ctx.fill();
 if(G.jump>0){const lift=Math.sin((.78-G.jump)/.78*Math.PI)*68;drawRunner(laneX,laneY-lift,t)}else if(G.slide>0){ctx.fillStyle='#ffd987';ctx.beginPath();ctx.ellipse(laneX,laneY+17,31,13,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(laneX-30,laneY+10,60,4)}else drawRunner(laneX,laneY,t);

 if(G.flash>0){ctx.fillStyle='rgba(255,70,90,'+(G.flash*1.5)+')';ctx.fillRect(0,0,w,h)}
}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(G&&G.state==='play')raf=requestAnimationFrame(loop)}
function act(a){if(a==='left')changeLane(-1);if(a==='right')changeLane(1);if(a==='jump')jump();if(a==='slide')slide()}
function pauseGame(){if(G&&G.state==='play'){G.state='pause';$('pause').hidden=false;cancelAnimationFrame(raf);SFX.pause()}}
function resumeGame(){if(G&&G.state==='pause'){G.state='play';$('pause').hidden=true;last=performance.now();raf=requestAnimationFrame(loop);ac()}}
window.addEventListener('keydown',function(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)&&G&&G.state==='play')e.preventDefault();if(e.repeat)return;const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')act('left');if(k==='ArrowRight'||k==='d'||k==='D')act('right');if(k==='ArrowUp'||k===' ')act('jump');if(k==='ArrowDown'||k==='s'||k==='S')act('slide');if(k==='p'||k==='P'||k==='Escape'){if(G&&G.state==='play')pauseGame();else if(G&&G.state==='pause')resumeGame()}});
document.querySelectorAll('[data-act]').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();act(b.dataset.act)})});
document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});ac();SFX.lane()}});
$('snd-on').onclick=function(){soundOn=true;$('snd-on').setAttribute('aria-pressed','true');$('snd-off').setAttribute('aria-pressed','false');SFX.jelly()};
$('snd-off').onclick=function(){soundOn=false;$('snd-on').setAttribute('aria-pressed','false');$('snd-off').setAttribute('aria-pressed','true')};
$('start').onclick=start;$('again').onclick=start;$('resume').onclick=resumeGame;$('quit').onclick=finish;$('pauseBtn').onclick=function(){if(G&&G.state==='play')pauseGame();else resumeGame()};
function goMenu(){
 cancelAnimationFrame(raf);clearTimeout(toastTimer);$('feedback').textContent='';
 $('over').hidden=true;$('pause').hidden=true;$('touch').hidden=true;$('menu').hidden=false;
 G={state:'idle',distance:0,laneVisual:1,jump:0,slide:0,inv:0,powerActive:0,obstacles:[],jellies:[],floats:[],quiz:null,flash:0};
 $('stats').innerHTML='<span class="big">0점</span><br>정답 0 / 0';
 $('life').innerHTML='<span class="big" id="timer">5:00</span><br>콤보 0';
 $('qlabel').textContent='日本語 単語ラン';$('prompt').className='qword';$('prompt').textContent='단어 카드가 다가오면 정답 길로!';$('hint').textContent='좌우로 움직여 정답이 적힌 길을 고르세요.';
 resize();draw();deckInfo();$('start').focus()
}
$('toMenu').onclick=goMenu;$('pauseHome').onclick=goMenu;
window.addEventListener('keydown',function(e){if((e.key==='h'||e.key==='H')&&G&&(G.state==='pause'||G.state==='over'))goMenu()});
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);window.addEventListener('resize',resize);
if(document.fonts&&document.fonts.load){document.fonts.load('800 20px "M PLUS Rounded 1c"','日本語学校').catch(function(){});document.fonts.load('20px "Jua"','한국어 뜻').catch(function(){})}
G={state:'idle',distance:0,laneVisual:1,jump:0,slide:0,inv:0,powerActive:0,obstacles:[],jellies:[],floats:[],quiz:null,flash:0};resize();draw();deckInfo();
</script>
